spring.application.name=backend

# ---------------------------------------------------------------------------
# Banco de dados
# Credenciais NUNCA ficam versionadas: sao lidas do ambiente.
# Para desenvolvimento local copie application-local.properties.example para
# application-local.properties (ignorado pelo git) e rode com o profile "local".
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/rr_maxx}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# validate: a aplicacao nunca altera o schema sozinha (OWASP A05)
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:validate}

# SQL nos logs expoe estrutura do banco: desligado por padrao (OWASP A05)
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false

# Nao expor stacktrace nem mensagem de excecao no corpo da resposta (OWASP A05)
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false

app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}

# ---------------------------------------------------------------------------
# JWT - sem valor padrao de proposito: sem APP_JWT_SECRET a aplicacao nao sobe
# (fail secure). Gere com: openssl rand -base64 48
# ---------------------------------------------------------------------------
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration=${APP_JWT_EXPIRATION:3600000}

# Bloqueio de forca bruta no login (OWASP A07)
app.login.max-tentativas=${APP_LOGIN_MAX_TENTATIVAS:5}
app.login.bloqueio-minutos=${APP_LOGIN_BLOQUEIO_MINUTOS:15}

# Admin inicial criado apenas quando a tabela de usuarios esta vazia (OWASP A01)
app.bootstrap.admin.email=${APP_BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin.nome=${APP_BOOTSTRAP_ADMIN_NOME:Administrador}
app.bootstrap.admin.senha=${APP_BOOTSTRAP_ADMIN_SENHA:}

# Swagger desligado por padrao; habilite apenas em desenvolvimento (OWASP A05)
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:false}

# ---------------------------------------------------------------------------
# Integracoes externas
# ---------------------------------------------------------------------------
apibrasil.base-url=${APIBRASIL_BASE_URL:https://gateway.apibrasil.io/api/v2}
apibrasil.token=${APIBRASIL_TOKEN:}
apibrasil.placa-endpoint=${APIBRASIL_PLACA_ENDPOINT:/vehicles/base/001/consulta}
apibrasil.placa-tipo=${APIBRASIL_PLACA_TIPO:fipe}
apibrasil.timeout.connect=3s
apibrasil.timeout.read=10s

viacep.base-url=${VIACEP_BASE_URL:https://viacep.com.br/ws}

# Notificacoes
# O envio externo (WhatsApp/SMS) esta desativado: as notificacoes sao apenas
# registradas no banco e no log, alimentando a tela de notificacoes.
notificacoes.revisao-scheduler-cron=${NOTIFICACOES_REVISAO_SCHEDULER_CRON:0 0 8 * * *}
