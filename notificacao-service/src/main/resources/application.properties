spring.application.name=notificacao-service

# Worker de fila: nao expoe HTTP
spring.main.web-application-type=none

# ---------------------------------------------------------------------------
# RabbitMQ - usuario e senha sem valor padrao de proposito (fail secure).
# Use as MESMAS credenciais da API principal.
# ---------------------------------------------------------------------------
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
spring.rabbitmq.ssl.enabled=${RABBITMQ_SSL_ENABLED:false}

# Uma mensagem por vez: o sandbox do WhatsApp aceita 1 mensagem a cada 3s
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.max-concurrency=1
spring.rabbitmq.listener.simple.prefetch=1

# Falha temporaria (Twilio fora do ar, timeout): tenta 3 vezes com espera
# crescente. Esgotadas as tentativas, o FalhaDefinitivaRecoverer avisa a API e
# manda a mensagem para a DLQ (notificacoes.envio.dlq), em vez de reentregar
# em loop infinito.
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=2s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=10s
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Se o RabbitMQ cair, o listener tenta reconectar a cada 5s
spring.rabbitmq.listener.simple.missing-queues-fatal=false
spring.rabbitmq.connection-timeout=5s

# ---------------------------------------------------------------------------
# Twilio - desligada por padrao: sem credenciais, as mensagens vao so para o
# log (modo simulado, sem custo). Para enviar de verdade, configure no
# application-local.properties ou em variaveis de ambiente.
# ---------------------------------------------------------------------------
twilio.enabled=${TWILIO_ENABLED:false}
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
# whatsapp ou sms
twilio.canal=${TWILIO_CANAL:whatsapp}
# Sandbox do WhatsApp: +14155238886. Para SMS: o numero comprado na Twilio.
twilio.remetente=${TWILIO_REMETENTE:+14155238886}
twilio.messaging-service-sid=${TWILIO_MESSAGING_SERVICE_SID:}
# Redireciona todas as mensagens para um numero (conta trial so envia para numeros verificados)
twilio.destino-teste=${TWILIO_DESTINO_TESTE:}
twilio.confirmacao-timeout=${TWILIO_CONFIRMACAO_TIMEOUT:10s}

# DDI aplicado a telefones salvos sem codigo do pais (ex.: 11999998888)
notificacao.codigo-pais-padrao=${NOTIFICACAO_CODIGO_PAIS:55}
